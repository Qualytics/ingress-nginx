name: Qualytics Helm chart

on:
  pull_request:
    paths:
      - charts/ingress-nginx/**
      - .github/workflows/chart.yaml
  push:
    branches: [main]
    paths:
      - charts/ingress-nginx/**
      - .github/workflows/chart.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.images.outputs.ready }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - name: Test chart
        run: |
          helm lint --strict charts/ingress-nginx
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.0 --verify=false
          helm unittest charts/ingress-nginx --file 'tests/**/*_test.yaml'
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5
      - name: Verify signed controller image pins
        id: images
        working-directory: charts/ingress-nginx
        run: |
          set -euo pipefail
          tag=$(yq -r '.controller.image.tag' values.yaml)
          [[ "$tag" == "v$(yq -r '.appVersion' Chart.yaml)" ]]
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-qualytics\.[0-9]+$ ]]
          digest=$(yq -r '.controller.image.digest' values.yaml)
          chroot_digest=$(yq -r '.controller.image.digestChroot' values.yaml)
          if [[ -z "$digest" && -z "$chroot_digest" ]]; then
            echo "::notice::Chart publication is pending both Docker Hub image digests."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ && "$chroot_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          source=https://github.com/Qualytics/ingress-nginx
          identity="$source/.github/workflows/qualytics-controller.yml@refs/heads/main"
          for chroot in false true; do
            variant=controller
            pin=$digest
            if [[ "$chroot" == true ]]; then
              variant=controller-chroot
              pin=$chroot_digest
            fi
            repo="docker.io/qualyticsai/ingress-nginx-$variant"
            rendered=$(helm template validate . --set "controller.image.chroot=$chroot" --show-only templates/controller-deployment.yaml |
              yq -r '.spec.template.spec.containers[0].image')
            [[ "$rendered" == "$repo:$tag@$pin" ]]
            index="provenance/$tag/$variant.index.json"
            bundle="provenance/$tag/$variant.sigstore.json"
            cosign verify-blob --bundle "$bundle" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$index"
            [[ "sha256:$(sha256sum "$index" | cut -d ' ' -f 1)" == "$pin" ]]
            jq -e --arg repo "$repo" --arg tag "$tag" --arg source "$source" '
              .annotations["org.opencontainers.image.ref.name"] == $repo and
              .annotations["org.opencontainers.image.version"] == $tag and
              .annotations["org.opencontainers.image.source"] == $source and
              ([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64","arm64"]
            ' "$index"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.outputs.ready == 'true' && github.repository == 'Qualytics/ingress-nginx' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: qualytics-ingress-nginx-helm-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5
      - name: Publish the verified controller release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(bash build/verify-controller-release.sh)
          if [[ -n "$tag" ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
      - name: Release package and update the GitHub Pages index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .cr-index
          cr package charts/ingress-nginx
          cr upload -o "$GITHUB_REPOSITORY_OWNER" -r "${GITHUB_REPOSITORY#*/}" -c "$GITHUB_SHA" --skip-existing --make-release-latest=false
          cr index -o "$GITHUB_REPOSITORY_OWNER" -r "${GITHUB_REPOSITORY#*/}" --pages-branch gh-pages --push
      - name: Publish the branch index and verify the public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          chart_version=$(yq -r '.version' charts/ingress-nginx/Chart.yaml)
          for attempt in {1..30}; do
            if helm pull --repo https://qualytics.github.io/ingress-nginx ingress-nginx --version "$chart_version" --destination "$RUNNER_TEMP"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public Helm repository did not serve ingress-nginx $chart_version"
          exit 1
