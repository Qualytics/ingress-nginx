name: Qualytics controller

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified TAG version to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: docker.io/qualyticsai/ingress-nginx-controller

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run the upstream Go unit suite
        run: make ARCH=amd64 test

  qualify:
    name: Qualify ${{ matrix.variant }} linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [controller, controller-chroot]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            yq_sha: 129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973
          - arch: arm64
            runner: ubuntu-24.04-arm
            yq_sha: 89f69310b61b68d1245065a1241d1fc843f7a36cd6103ffd77ad987613bd1b67
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Qualytics/qualytics-self-hosted
          ref: afc232088aa5a98fbf30635293d2c5a42c9d3c10 # self-hosted 2026.11.24
          path: self-hosted-chart
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - uses: ./.github/actions/setup-kind
      - name: Install test tools
        env:
          ARCH: ${{ matrix.arch }}
          YQ_SHA: ${{ matrix.yq_sha }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_$ARCH" -o yq
          echo "$YQ_SHA  yq" | sha256sum --check
          sudo install -m 0755 yq /usr/local/bin/yq
      - name: Build the release candidate from source
        env:
          ARCH: ${{ matrix.arch }}
          COMMIT_SHA: ${{ github.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          export VERSION="$(cat TAG)"
          docker buildx bake "$VARIANT" --set "*.platform=linux/$ARCH" \
            --set "$VARIANT.output=type=oci,dest=$VARIANT-$ARCH.tar" \
            --sbom=true --provenance=mode=max
          mv "$VARIANT-$ARCH.tar" "$RUNNER_TEMP/"
          skopeo --override-os linux --override-arch "$ARCH" copy \
            "oci-archive:$RUNNER_TEMP/$VARIANT-$ARCH.tar" "docker-daemon:qualytics-$VARIANT:qualification"
      - name: Scan the candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: qualytics-${{ matrix.variant }}:qualification
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
        env:
          TRIVY_IMAGE_SRC: docker
      - name: Verify native package ownership and ModSecurity linkage
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          root=/
          if [[ "$VARIANT" == controller-chroot ]]; then root=/chroot; fi
          docker run --rm --network none --user 0 --entrypoint sh \
            --mount "type=bind,src=$PWD/images/nginx/rootfs/libxml2,dst=/packages/libxml2,readonly" \
            "qualytics-$VARIANT:qualification" -ec '
            root=$1
            apk --root "$root" info --installed --quiet grpc protobuf "libxml2=2.13.9-r4"
            apk --root "$root" info --who-owns /usr/lib/libxml2.so.2.13.9 | grep -F "libxml2-2.13.9-r4"
            cd "$root"
            apk manifest "/packages/libxml2/$(apk --print-arch)/libxml2-2.13.9-r4.apk" | sed "s/^sha1://" | sha1sum -c
            loader=$(basename "$root"/lib/ld-musl-*.so.1)
            libraries=$(chroot "$root" "/lib/$loader" --list /usr/local/modsecurity/lib/libmodsecurity.so)
            echo "$libraries" | grep -F "libxml2.so.2 => /usr/lib/libxml2.so.2"
          ' sh "$root"
      - name: Verify NGINX exports an OTLP trace over gRPC
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash hack/qualytics/check-otlp.sh "qualytics-$VARIANT:qualification" "$VARIANT"
      - name: Run Qualytics chart qualification
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          options=()
          if [[ "$VARIANT" == controller-chroot ]]; then options+=(--chroot); fi
          mapfile -t nodes < test/e2e/kind-node-images
          for node in "${nodes[@]}"; do
            echo "::group::Qualify Kubernetes ${node%@*}"
            K8S_VERSION="$node" bash hack/qualytics/chart-smoke.sh "qualytics-$VARIANT:qualification" self-hosted-chart "${options[@]}"
            echo "::endgroup::"
          done
      - name: Retain the exact qualified image and attestations for release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Qualytics/ingress-nginx'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.variant }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  qualify-webhook:
    name: Qualify webhook certgen linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
      COMMIT_SHA: ${{ github.sha }}
      CANDIDATE: docker.io/qualytics-local/kube-webhook-certgen:qualification
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - uses: ./.github/actions/setup-kind
      - name: Build the exact webhook candidate and attestations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          export VERSION="$(cat TAG)"
          target=controller-webhook-certgen
          archive="$target-$ARCH.tar"
          docker buildx bake "$target" --set "$target.platform=linux/$ARCH" \
            --set "$target.output=type=oci,dest=$archive" --sbom=true --provenance=mode=max
          mv "$archive" "$RUNNER_TEMP/"
          skopeo --override-os linux --override-arch "$ARCH" copy \
            "oci-archive:$RUNNER_TEMP/$archive" "docker-daemon:$CANDIDATE"
      - name: Scan the webhook candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.CANDIDATE }}
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: false
        env:
          TRIVY_IMAGE_SRC: docker
      - name: Verify the webhook executable and metadata
        run: |
          version="kube-webhook-certgen-$(cat TAG)"
          test "$(docker image inspect "$CANDIDATE" --format '{{.Os}}/{{.Architecture}} {{.Config.User}}')" = "linux/$ARCH 65532:65532"
          test "$(docker image inspect "$CANDIDATE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect "$CANDIDATE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT_SHA"
          output=$(docker run --rm --network none --read-only --cap-drop ALL "$CANDIDATE" version)
          grep -Fx "$version" <<< "$output"
          grep -Fx "go$(cat GOLANG_VERSION)" <<< "$output"
      - name: Exercise admission certificate creation and webhook patching
        run: |
          mapfile -t nodes < test/e2e/kind-node-images
          for node in "${nodes[@]}"; do
            bash hack/qualytics/webhook-smoke.sh "$CANDIDATE" "$node"
          done
      - name: Retain the qualified webhook image and attestations
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Qualytics/ingress-nginx'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: controller-webhook-certgen-${{ matrix.arch }}
          path: ${{ runner.temp }}/controller-webhook-certgen-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    needs: [unit, qualify, qualify-webhook]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Qualytics/ingress-nginx'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controller-*
          merge-multiple: true
          path: ${{ runner.temp }}/qualified
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5
      - name: Sign the exact multiarchitecture indices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          bash build/package-controller.sh "$RUNNER_TEMP/qualified" "$RUNNER_TEMP/images"
          mkdir "$RUNNER_TEMP/signed"
          source build/controller-images.sh
          for variant in "${controller_images[@]}"; do
            cp "$RUNNER_TEMP/images/$variant.index.json" "$RUNNER_TEMP/signed/"
            cosign sign-blob --yes --bundle "$RUNNER_TEMP/signed/$variant.sigstore.json" "$RUNNER_TEMP/signed/$variant.index.json"
          done
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed
          if-no-files-found: error

  publish:
    needs: sign
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'Qualytics/ingress-nginx'
    runs-on: ubuntu-24.04
    environment: dockerhub-production
    concurrency:
      group: qualytics-controller-dockerhub-production
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controller-*
          merge-multiple: true
          path: ${{ runner.temp }}/qualified
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: qualyticsai
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      - name: Publish the signed version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          gh release download v1.30.0 --repo docker/scout-cli --pattern docker-scout_1.30.0_linux_amd64.tar.gz --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/docker-scout_1.30.0_linux_amd64.tar.gz"
          echo "bd8d24896d2aa0f9e01d25830ac53cfd416a3254f8fbfce2cb10bcd7a1afe152  $archive" | sha256sum --check
          mkdir -p "$HOME/.docker/cli-plugins"
          tar -xzf "$archive" -C "$HOME/.docker/cli-plugins" docker-scout
          bash build/publish-controller.sh "$RUNNER_TEMP/qualified" "$RUNNER_TEMP/signed"
