suite: Registry pull secrets
templates:
  - controller-deployment.yaml
  - default-backend-deployment.yaml
  - admission-webhooks/job-patch/job-createSecret.yaml
  - admission-webhooks/job-patch/job-patchWebhook.yaml
set:
  defaultBackend.enabled: true
tests:
  - it: allows Kubernetes to supply pull credentials when no names are configured
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: inherits named secrets from the parent chart
    set:
      global.imagePullSecrets:
        - first-secret
        - name: second-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: first-secret
            - name: second-secret

  - it: gives a chart-local secret precedence
    set:
      global.imagePullSecrets: [parent-secret]
      imagePullSecrets:
        - name: controller-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: controller-secret

  - it: honors an explicit empty list even with parent credentials
    set:
      global.imagePullSecrets: [parent-secret]
      imagePullSecrets: []
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
