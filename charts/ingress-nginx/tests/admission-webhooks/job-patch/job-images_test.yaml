suite: Admission Webhooks > Patch Job > Images
templates:
  - admission-webhooks/job-patch/job-createSecret.yaml
  - admission-webhooks/job-patch/job-patchWebhook.yaml

tests:
  - it: pins both webhook jobs to the Qualytics helper in the controller repository
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^docker\.io/qualyticsai/ingress-nginx-controller:kube-webhook-certgen-v[0-9.]+-qualytics\.[0-9]+@sha256:[0-9a-f]{64}$'

  - it: applies a global registry mirror to both webhook jobs
    set:
      global.image.registry: mirror.example
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^mirror\.example/qualyticsai/ingress-nginx-controller:kube-webhook-certgen-v[0-9.]+-qualytics\.[0-9]+@sha256:[0-9a-f]{64}$'

  - it: gives a fully qualified webhook repository precedence over the global mirror
    set:
      global.image.registry: mirror.example
      controller.admissionWebhooks.patch.image.repository: private.example/certs/generator
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^private\.example/certs/generator:[^@]+@sha256:[0-9a-f]{64}$'
